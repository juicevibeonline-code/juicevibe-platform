version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: juice-vibe-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: juicevibe
      POSTGRES_PASSWORD: juicevibe123
      POSTGRES_DB: juice-vibe
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: juice-vibe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: juice-vibe-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://juicevibe:juicevibe123@postgres:5432/juice-vibe?schema=public"
      JWT_SECRET: "change-this-in-production"
      JWT_REFRESH_SECRET: "change-this-refresh-secret"
      PORT: 4000
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    command: sh -c "pnpm db:push && pnpm db:seed && pnpm --filter @juice-vibe/api start"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: juice-vibe-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    depends_on:
      - api

volumes:
  postgres_data:
